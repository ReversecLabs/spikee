name: Lint & Functional Tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main' || !startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff # Ruff pinned 10/09/2026
        run: pip install ruff==0.16.6 

      - name: Check formatting, imports, and lint
        run: |
          ruff format --check ./spikee/
          ruff check ./spikee/

  functional-tests:
    runs-on: ubuntu-latest
    needs: [lint]
    # Always run tests; if lint ran it must have succeeded; if lint was skipped (workflow_call) run anyway
    if: always() && (needs.lint.result == 'success' || (needs.lint.result == 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main' || !startsWith(github.event.pull_request.head.ref, 'release/'))))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # On PRs, check out the head repository and ref so fork branches are available.
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install spikee package
        run: pip install .[all]

      - name: Run functional tests
        run: pytest tests/functional

  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/release -q
