name: Publish Reviewed Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    env:
      SKIP_PYPI: ${{ vars.SKIP_PYPI || 'false' }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install toml

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")"
          case "${VERSION}" in
            *-dev) echo "ERROR: main must contain a release version, not ${VERSION}"; exit 1 ;;
          esac
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not exist
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "ERROR: Tag v${VERSION} already exists."
            exit 1
          fi

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        if: env.SKIP_PYPI != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create and push release tag
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  sync-develop:
    needs: publish
    uses: ./.github/workflows/sync-release.yaml
    with:
      release_ref: ${{ github.event.pull_request.merge_commit_sha }}
